<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Shalini SmartMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="smart-card p-4 p-md-5 border-top border-warning border-4">
                    <div class="text-center mb-4">
                        <div class="fs-1 text-warning"><i class="bi bi-shield-lock-fill"></i></div>
                        <h3 class="fw-bold text-dark mb-1">Admin Portal</h3>
                        <p class="text-muted small mb-3">Administrator Authentication for <strong>Shalini SmartMart</strong></p>

                        <!-- Two Options: Customer Login vs Admin Login -->
                        <div class="nav nav-pills nav-justified mb-4 p-1 bg-light rounded-pill border">
                            <a class="nav-link text-secondary rounded-pill fw-bold" th:href="@{/login}"><i class="bi bi-person me-1"></i> Customer Login</a>
                            <a class="nav-link active bg-warning text-dark rounded-pill fw-bold" th:href="@{/admin/login}"><i class="bi bi-shield-lock me-1"></i> Admin Login</a>
                        </div>
                    </div>

                    <!-- Flash messages -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}">Invalid admin email or password.</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/admin/login}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Admin Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope-at"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="e.g. admin@smartmart.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Admin Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-2 rounded-pill fw-bold shadow-sm text-dark">
                            <i class="bi bi-shield-check me-1"></i> Login as Administrator
                        </button>
                    </form>

                    <!-- Default Admin Credentials Box -->
                    <div class="mt-4 p-3 bg-light rounded border">
                        <h6 class="fw-bold small mb-2 text-secondary"><i class="bi bi-info-circle text-warning me-1"></i> Configured Admin Credentials:</h6>
                        <div class="d-flex justify-content-between small text-muted">
                            <span><strong>Admin Email:</strong> admin@smartmart.com</span>
                            <span><strong>Password:</strong> admin123</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
