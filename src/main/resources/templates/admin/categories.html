<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management - Admin Shalini SmartMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <!-- Admin Subnav Navigation Bar -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-3">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <h4 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-tags text-warning me-2"></i> Category Management
                    </h4>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                        <a th:href="@{/admin/products}" class="btn btn-outline-primary btn-sm rounded-pill px-3"><i class="bi bi-box-seam me-1"></i> Products</a>
                        <a th:href="@{/admin/categories}" class="btn btn-warning btn-sm rounded-pill px-3 fw-bold"><i class="bi bi-tags me-1"></i> Categories</a>
                        <a th:href="@{/admin/customers}" class="btn btn-outline-info btn-sm rounded-pill px-3"><i class="bi bi-people me-1"></i> Customers</a>
                        <a th:href="@{/admin/orders}" class="btn btn-outline-success btn-sm rounded-pill px-3"><i class="bi bi-cart-check me-1"></i> Orders</a>
                        <a th:href="@{/admin/reports}" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-graph-up-arrow me-1"></i> Reports</a>
                        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm rounded-pill px-3"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <!-- Add / Edit Category Form -->
            <div class="col-lg-4">
                <div class="smart-card p-4">
                    <h5 class="fw-bold text-dark mb-3"><i class="bi bi-plus-circle-fill text-warning me-2"></i> Add / Edit Category</h5>
                    <form th:action="@{/admin/categories/save}" method="post">
                        <input type="hidden" id="categoryId" name="id">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label fw-semibold">Category Name</label>
                            <input type="text" class="form-control" id="categoryName" name="name" placeholder="e.g. Organic Dairy" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning fw-bold text-dark rounded-pill px-4 flex-grow-1">
                                <i class="bi bi-save me-1"></i> Save Category
                            </button>
                            <button type="button" onclick="clearCategoryForm()" class="btn btn-light rounded-pill px-3">Clear</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Category List Table -->
            <div class="col-lg-8">
                <div class="smart-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-dark mb-0"><i class="bi bi-list-ul text-primary me-2"></i> Product Categories</h5>
                        <span class="badge bg-secondary rounded-pill" th:text="${#lists.size(categories) + ' Categories'}">0 Categories</span>
                    </div>

                    <div class="table-responsive">
                        <table class="table align-middle table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th># ID</th>
                                    <th>Category Name</th>
                                    <th>Product Count</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td class="fw-bold text-muted" th:text="${cat.id}">1</td>
                                    <td class="fw-bold text-dark" th:text="${cat.name}">Category Name</td>
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${cat.products != null ? #lists.size(cat.products) + ' items' : '0 items'}">0 items</span>
                                    </td>
                                    <td class="text-end">
                                        <button type="button" 
                                                th:onclick="'editCategory(' + ${cat.id} + ', \'' + ${#strings.escapeJavaScript(cat.name)} + '\')'" 
                                                class="btn btn-sm btn-outline-primary rounded-pill px-3 me-1">
                                            <i class="bi bi-pencil me-1"></i> Edit
                                        </button>
                                        <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}" 
                                           onclick="return confirm('Are you sure you want to delete this category?')" 
                                           class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                            <i class="bi bi-trash me-1"></i> Delete
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(categories)}">
                                    <td colspan="4" class="text-center py-4 text-muted">No categories created yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        function editCategory(id, name) {
            document.getElementById('categoryId').value = id;
            document.getElementById('categoryName').value = name;
            document.getElementById('categoryName').focus();
        }
        function clearCategoryForm() {
            document.getElementById('categoryId').value = '';
            document.getElementById('categoryName').value = '';
        }
    </script>
</body>
</html>
