<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Admin Shalini SmartMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <!-- Admin Subnav Navigation Bar -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-3">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <h4 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-box-seam text-primary me-2"></i> Product Management
                    </h4>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                        <a th:href="@{/admin/products}" class="btn btn-primary btn-sm rounded-pill px-3 fw-bold"><i class="bi bi-box-seam me-1"></i> Products</a>
                        <a th:href="@{/admin/categories}" class="btn btn-outline-warning text-dark btn-sm rounded-pill px-3"><i class="bi bi-tags me-1"></i> Categories</a>
                        <a th:href="@{/admin/customers}" class="btn btn-outline-info btn-sm rounded-pill px-3"><i class="bi bi-people me-1"></i> Customers</a>
                        <a th:href="@{/admin/orders}" class="btn btn-outline-success btn-sm rounded-pill px-3"><i class="bi bi-cart-check me-1"></i> Orders</a>
                        <a th:href="@{/admin/reports}" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-graph-up-arrow me-1"></i> Reports</a>
                        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm rounded-pill px-3"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search, Filter & Add Button Bar -->
        <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
            <form th:action="@{/admin/products}" method="get" class="row g-2 align-items-center">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" name="search" th:value="${currentSearch}" placeholder="Search products by name...">
                    </div>
                </div>
                <div class="col-md-4">
                    <select class="form-select" name="category" onchange="this.form.submit()">
                        <option value="0" th:selected="${currentCategory == 0}">All Categories</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${currentCategory == c.id}">Category</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary rounded-pill px-3 flex-grow-1">Filter</button>
                    <a th:href="@{/admin/products/add}" class="btn btn-success rounded-pill px-3 text-nowrap shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Add Product
                    </a>
                </div>
            </form>
        </div>

        <!-- Flash Alert Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Products Table Card -->
        <div class="smart-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Products List</h5>
                <span class="badge bg-secondary rounded-pill" th:text="${#lists.size(products) + ' Products'}">0 Products</span>
            </div>

            <div class="table-responsive">
                <table class="table align-middle table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Discount</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td class="fw-bold text-muted" th:text="${'#' + p.id}">#1</td>
                            <td>
                                <img th:src="${p.image}" th:alt="${p.name}" class="rounded border" style="width: 50px; height: 50px; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=500&auto=format&fit=crop'">
                            </td>
                            <td>
                                <div class="fw-bold text-dark" th:text="${p.name}">Name</div>
                                <small class="text-muted" th:text="${#strings.abbreviate(p.description, 40)}">Description</small>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${p.category.name}">Category</span>
                            </td>
                            <td>
                                <div class="fw-bold text-success" th:text="${'₹' + p.finalPrice}">₹100</div>
                                <small th:if="${p.discount > 0}" class="text-muted text-decoration-line-through" th:text="${'₹' + p.price}">₹120</small>
                            </td>
                            <td>
                                <span th:if="${p.discount > 0}" class="badge bg-danger" th:text="${#numbers.formatDecimal(p.discount, 0, 0) + '%'}">10%</span>
                                <span th:if="${p.discount <= 0}" class="text-muted small">0%</span>
                            </td>
                            <td>
                                <!-- Quick Stock Update Form with validation -->
                                <form th:action="@{/admin/products/stock}" method="post" class="d-flex align-items-center gap-1" style="max-width: 140px;">
                                    <input type="hidden" name="productId" th:value="${p.id}">
                                    <input type="number" name="stock" th:value="${p.stock}" class="form-control form-control-sm text-center fw-bold" min="0" required>
                                    <button type="submit" class="btn btn-sm btn-outline-success" title="Update Stock"><i class="bi bi-check-lg"></i></button>
                                </form>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-outline-primary btn-sm rounded-circle" title="Edit Product">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/admin/products/delete/{id}(id=${p.id})}" class="btn btn-outline-danger btn-sm rounded-circle" onclick="return confirm('Are you sure you want to delete this product?');" title="Delete Product">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="8" class="text-center py-4 text-muted">No products found matching your search criteria.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
