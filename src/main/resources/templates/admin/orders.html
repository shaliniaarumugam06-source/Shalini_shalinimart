<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Admin Shalini SmartMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <!-- Admin Subnav Navigation Bar -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-3">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <h4 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-truck text-success me-2"></i> Order Management
                    </h4>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                        <a th:href="@{/admin/products}" class="btn btn-outline-primary btn-sm rounded-pill px-3"><i class="bi bi-box-seam me-1"></i> Products</a>
                        <a th:href="@{/admin/categories}" class="btn btn-outline-warning text-dark btn-sm rounded-pill px-3"><i class="bi bi-tags me-1"></i> Categories</a>
                        <a th:href="@{/admin/customers}" class="btn btn-outline-info btn-sm rounded-pill px-3"><i class="bi bi-people me-1"></i> Customers</a>
                        <a th:href="@{/admin/orders}" class="btn btn-success btn-sm rounded-pill px-3 fw-bold"><i class="bi bi-cart-check me-1"></i> Orders</a>
                        <a th:href="@{/admin/reports}" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-graph-up-arrow me-1"></i> Reports</a>
                        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm rounded-pill px-3"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search and Filter Bar -->
        <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
            <form th:action="@{/admin/orders}" method="get" class="row g-2 align-items-center">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" name="search" th:value="${currentSearch}" placeholder="Search by Order ID (ORD-...), Customer Name, or Phone...">
                    </div>
                </div>
                <div class="col-md-4">
                    <select class="form-select" name="status" onchange="this.form.submit()">
                        <option value="ALL" th:selected="${currentStatus == 'ALL'}">All Statuses</option>
                        <option th:each="st : ${validStatuses}" th:value="${st}" th:text="${st}" th:selected="${currentStatus == st}">Status</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-success rounded-pill">Filter Orders</button>
                </div>
            </form>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Orders Table Card -->
        <div class="smart-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Customer Orders</h5>
                <span class="badge bg-secondary rounded-pill" th:text="${#lists.size(orders) + ' Orders'}">0 Orders</span>
            </div>

            <div class="table-responsive">
                <table class="table align-middle table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Order ID</th>
                            <th>Customer Info</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Update Status</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="o : ${orders}">
                            <td class="fw-bold text-success" th:text="${o.orderNumber}">ORD-1001</td>
                            <td>
                                <div class="fw-bold text-dark" th:text="${o.user.name}">Name</div>
                                <small class="text-muted d-block" th:text="${o.user.phone}">Phone</small>
                                <small class="text-muted text-truncate d-block" style="max-width: 150px;" th:text="${o.deliveryAddress}">Address</small>
                            </td>
                            <td>
                                <small class="fw-semibold" th:text="${o.formattedDate}">Date</small>
                            </td>
                            <td class="fw-bold text-success" th:text="${'₹' + o.totalAmount}">₹500</td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${o.paymentMethod}">COD</span>
                            </td>
                            <td>
                                <span th:classappend="${o.status == 'Delivered' ? 'bg-success' : (o.status == 'Cancelled' ? 'bg-danger' : 'bg-primary')}" class="badge px-3 py-2 text-white">
                                    <span th:text="${o.status}">Order Placed</span>
                                </span>
                            </td>
                            <td>
                                <form th:action="@{/admin/orders/status}" method="post" class="d-flex gap-1" style="min-width: 210px;">
                                    <input type="hidden" name="orderId" th:value="${o.id}">
                                    <select class="form-select form-select-sm" name="status" required>
                                        <option value="Order Placed" th:selected="${o.status == 'Order Placed'}">Order Placed</option>
                                        <option value="Confirmed" th:selected="${o.status == 'Confirmed'}">Confirmed</option>
                                        <option value="Packed" th:selected="${o.status == 'Packed'}">Packed</option>
                                        <option value="Out for Delivery" th:selected="${o.status == 'Out for Delivery'}">Out for Delivery</option>
                                        <option value="Delivered" th:selected="${o.status == 'Delivered'}">Delivered</option>
                                        <option value="Cancelled" th:selected="${o.status == 'Cancelled'}">Cancelled</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-success" title="Update Status">Update</button>
                                </form>
                            </td>
                            <td>
                                <a th:href="@{/orders/{id}(id=${o.id})}" class="btn btn-outline-secondary btn-sm rounded-circle" title="View Full Order Details">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="8" class="text-center py-4 text-muted">No orders found matching your search criteria.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
