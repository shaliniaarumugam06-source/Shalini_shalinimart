<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id != null ? 'Edit Product - Admin Shalini SmartMart' : 'Add Product - Admin Shalini SmartMart'}">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="smart-card p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold mb-0 text-dark">
                            <i class="bi bi-box-seam text-success me-2"></i>
                            <span th:text="${product.id != null ? 'Edit Product' : 'Add New Product'}">Product Form</span>
                        </h3>
                        <a th:href="@{/admin/products}" class="btn btn-outline-secondary btn-sm rounded-pill">
                            <i class="bi bi-arrow-left me-1"></i> Back to Products
                        </a>
                    </div>

                    <form th:action="@{/admin/products/save}" method="post">
                        <input type="hidden" name="id" th:value="${product.id}">

                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" th:value="${product.name}" placeholder="e.g. Royal Basmati Rice 5kg" required>
                        </div>

                        <div class="mb-3">
                            <label for="categoryId" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="categoryId" name="categoryId" required>
                                <option value="" disabled th:selected="${product.category == null}">-- Select Category --</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product.category != null and product.category.id == c.id}">Category</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="description" name="description" rows="3" placeholder="Enter product description, key highlights and specifications" required th:text="${product.description}"></textarea>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="price" class="form-label fw-semibold">Price (₹) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="price" name="price" th:value="${product.price}" placeholder="e.g. 199.00" required>
                            </div>

                            <div class="col-md-4">
                                <label for="discount" class="form-label fw-semibold">Discount (%)</label>
                                <input type="number" step="0.1" min="0" max="100" class="form-control" id="discount" name="discount" th:value="${product.discount != null ? product.discount : 0.0}" placeholder="e.g. 10.0">
                            </div>

                            <div class="col-md-4">
                                <label for="stock" class="form-label fw-semibold">Stock Quantity <span class="text-danger">*</span></label>
                                <input type="number" min="0" class="form-control" id="stock" name="stock" th:value="${product.stock}" placeholder="e.g. 50" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="image" class="form-label fw-semibold">Product Image URL <span class="text-danger">*</span></label>
                            <input type="url" class="form-control" id="image" name="image" th:value="${product.image}" placeholder="https://images.unsplash.com/..." required>
                            <div class="form-text">Direct image URL to display in catalog and product cards.</div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 rounded-pill fw-bold shadow">
                            <i class="bi bi-check-circle me-1"></i> Save Product
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
