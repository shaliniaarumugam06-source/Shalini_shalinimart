<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - Shalini SmartMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <!-- Header Banner -->
        <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
            <div class="row align-items-center g-3">
                <div class="col-md-6">
                    <h2 class="fw-bold mb-1"><i class="bi bi-shop text-success me-2"></i> Products Catalog</h2>
                    <p class="text-muted mb-0">Browse fresh groceries, fruits, staples and personal care items</p>
                </div>
                
                <!-- Search & Filter Form -->
                <div class="col-md-6">
                    <form th:action="@{/products}" method="get">
                        <div class="row g-2">
                            <div class="col-6">
                                <select class="form-select border-success" name="category" onchange="this.form.submit()">
                                    <option value="0" th:selected="${currentCategory == 0}">All Categories</option>
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${currentCategory == c.id}">Category</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <div class="input-group">
                                    <input type="text" class="form-control border-success" name="search" th:value="${currentSearch}" placeholder="Search products...">
                                    <button class="btn btn-success" type="submit"><i class="bi bi-search"></i></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Category Pill Filters -->
        <div class="d-flex flex-wrap gap-2 mb-4">
            <a th:href="@{/products}" class="btn btn-sm rounded-pill px-3" th:classappend="${currentCategory == 0 ? 'btn-success' : 'btn-outline-secondary'}">All</a>
            <a th:each="c : ${categories}" th:href="@{/products(category=${c.id})}" class="btn btn-sm rounded-pill px-3" th:classappend="${currentCategory == c.id ? 'btn-success' : 'btn-outline-secondary'}" th:text="${c.name}">Category</a>
        </div>

        <!-- Product Grid -->
        <div th:if="${#lists.isEmpty(products)}" class="text-center py-5 bg-white rounded-4 shadow-sm">
            <div class="fs-1 text-muted"><i class="bi bi-search"></i></div>
            <h4 class="fw-bold mt-2">No products found</h4>
            <p class="text-muted">Try searching with a different keyword or category filter.</p>
            <a th:href="@{/products}" class="btn btn-success btn-sm rounded-pill">Reset Filters</a>
        </div>

        <div class="row g-4" th:if="${!#lists.isEmpty(products)}">
            <div th:each="p : ${products}" class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="smart-card product-card">
                    <div class="product-img-wrap">
                        <img th:src="${p.image}" th:alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=500&auto=format&fit=crop'">
                        <span th:if="${p.discount > 0}" class="discount-badge" th:text="${#numbers.formatDecimal(p.discount, 0, 0) + '% OFF'}">10% OFF</span>
                        <span th:if="${p.stock > 0}" class="stock-badge bg-success text-white">In Stock (<span th:text="${p.stock}"></span>)</span>
                        <span th:if="${p.stock <= 0}" class="stock-badge bg-danger text-white">Out of Stock</span>
                    </div>
                    <div class="card-body p-3 d-flex flex-column">
                        <small class="text-muted text-uppercase fw-semibold" th:text="${p.category.name}">Category</small>
                        <h6 class="fw-bold text-dark mt-1 mb-2 text-truncate" th:text="${p.name}">Product Name</h6>
                        
                        <!-- Price Block -->
                        <div class="mt-auto mb-3">
                            <span class="price-tag" th:text="${'₹' + p.finalPrice}">₹100</span>
                            <span th:if="${p.discount > 0}" class="original-price" th:text="${'₹' + p.price}">₹120</span>
                        </div>

                        <!-- Buttons -->
                        <div class="d-grid gap-2">
                            <form th:action="@{/cart/add}" method="post" class="d-grid">
                                <input type="hidden" name="productId" th:value="${p.id}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-success btn-sm rounded-pill" th:disabled="${p.stock <= 0}">
                                    <i class="bi bi-cart-plus me-1"></i> Add to Cart
                                </button>
                            </form>
                            <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-outline-secondary btn-sm rounded-pill">
                                <i class="bi bi-eye me-1"></i> View Details
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
