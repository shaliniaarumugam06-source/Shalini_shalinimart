<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Shalini SmartMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <h2 class="fw-bold mb-4"><i class="bi bi-shield-check text-success me-2"></i> Checkout</h2>

        <!-- Flash Alert Messages -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/checkout}" method="post">
            <div class="row g-4">
                <!-- Delivery Details & Payment Selection -->
                <div class="col-lg-7">
                    <!-- Customer Details Card -->
                    <div class="smart-card p-4 mb-4">
                        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-geo-alt me-2 text-danger"></i> Delivery Address & Customer Info</h5>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Customer Name</label>
                            <input type="text" class="form-control" th:value="${user.name}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Phone Number</label>
                            <input type="text" class="form-control" th:value="${user.phone}" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="deliveryAddress" class="form-label fw-bold">Delivery Address</label>
                            <textarea class="form-control" id="deliveryAddress" name="deliveryAddress" rows="3" required th:text="${user.address}"></textarea>
                            <div class="form-text">You can edit the delivery address above if needed.</div>
                        </div>
                    </div>

                    <!-- Payment Method Card -->
                    <div class="smart-card p-4">
                        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-credit-card me-2 text-primary"></i> Select Payment Method</h5>
                        
                        <div class="form-check p-3 border rounded-3 mb-3 bg-white">
                            <input class="form-check-input ms-1" type="radio" name="paymentMethod" id="cod" value="Cash on Delivery" checked>
                            <label class="form-check-label fw-bold ms-2" for="cod">
                                <i class="bi bi-cash-stack text-success me-1 fs-5"></i> Cash on Delivery (COD)
                                <div class="text-muted small fw-normal">Pay cash directly to our delivery executive upon arrival.</div>
                            </label>
                        </div>

                        <div class="form-check p-3 border rounded-3 bg-white">
                            <input class="form-check-input ms-1" type="radio" name="paymentMethod" id="online" value="Online Payment – Demo Only">
                            <label class="form-check-label fw-bold ms-2" for="online">
                                <i class="bi bi-qr-code-scan text-primary me-1 fs-5"></i> Online Payment – Demo Only
                                <div class="text-muted small fw-normal">Instant virtual checkout for capstone evaluation.</div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Order Summary Sidebar -->
                <div class="col-lg-5">
                    <div class="smart-card p-4">
                        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-bag-check me-2"></i> Items in Order</h5>
                        
                        <div class="list-group list-group-flush mb-3">
                            <div th:each="item : ${cart.items}" class="list-group-item d-flex justify-content-between align-items-center px-0 bg-transparent">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-secondary" th:text="${item.quantity + 'x'}">1x</span>
                                    <span class="fw-bold text-dark text-truncate" style="max-width: 180px;" th:text="${item.product.name}">Product</span>
                                </div>
                                <span class="fw-bold" th:text="${'₹' + item.subtotal}">₹100</span>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span class="fw-bold" th:text="${'₹' + itemsSubtotal}">₹0</span>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Delivery Charge</span>
                            <span th:if="${deliveryCharge == 0}" class="text-success fw-bold">FREE</span>
                            <span th:if="${deliveryCharge > 0}" class="fw-bold" th:text="${'₹' + deliveryCharge}">₹40</span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-4 fs-4">
                            <span class="fw-bold">Final Total</span>
                            <span class="fw-bold text-success" th:text="${'₹' + finalTotal}">₹0</span>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill fw-bold shadow">
                            <i class="bi bi-check-circle-fill me-2"></i> Place Order
                        </button>
                    </div>
                </div>
            </div>
        </form>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
