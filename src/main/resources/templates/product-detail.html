<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name + ' - Shalini SmartMart'}">Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-success text-decoration-none">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/products}" class="text-success text-decoration-none">Products</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Product</li>
            </ol>
        </nav>

        <div class="smart-card p-4 p-md-5">
            <div class="row g-4 align-items-center">
                <!-- Product Image -->
                <div class="col-md-5 text-center">
                    <div class="product-img-wrap rounded-4 border bg-white p-3">
                        <img th:src="${product.image}" th:alt="${product.name}" class="img-fluid" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=500&auto=format&fit=crop'">
                    </div>
                </div>

                <!-- Product Details -->
                <div class="col-md-7">
                    <span class="badge bg-secondary mb-2 text-uppercase" th:text="${product.category.name}">Category</span>
                    <h2 class="fw-bold text-dark mb-2" th:text="${product.name}">Product Name</h2>

                    <!-- Rating / Stock Status -->
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <span th:if="${product.stock > 0}" class="badge bg-success px-3 py-2 fs-6">
                            <i class="bi bi-check-circle me-1"></i> In Stock (<span th:text="${product.stock}"></span> available)
                        </span>
                        <span th:if="${product.stock <= 0}" class="badge bg-danger px-3 py-2 fs-6">
                            <i class="bi bi-x-circle me-1"></i> Out of Stock
                        </span>
                        <span th:if="${product.discount > 0}" class="badge bg-danger px-3 py-2 fs-6" th:text="${#numbers.formatDecimal(product.discount, 0, 0) + '% Discount'}">
                            Discount
                        </span>
                    </div>

                    <!-- Price -->
                    <div class="my-4 p-3 bg-light rounded-3 border d-inline-block w-100">
                        <div class="d-flex align-items-baseline gap-2">
                            <span class="fs-1 fw-bold text-success" th:text="${'₹' + product.finalPrice}">₹100</span>
                            <span th:if="${product.discount > 0}" class="text-muted text-decoration-line-through fs-5" th:text="${'₹' + product.price}">₹120</span>
                            <span th:if="${product.discount > 0}" class="text-danger fw-semibold small">
                                Save ₹<span th:text="${#numbers.formatDecimal(product.price - product.finalPrice, 0, 2)}">20</span>
                            </span>
                        </div>
                    </div>

                    <!-- Description -->
                    <h5 class="fw-bold text-secondary mb-2">Description</h5>
                    <p class="text-muted mb-4" th:text="${product.description}">Product description goes here...</p>

                    <!-- Add to Cart Form -->
                    <form th:action="@{/cart/add}" method="post" class="mt-4">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="row g-3 align-items-center">
                            <div class="col-auto">
                                <label for="quantity" class="col-form-label fw-bold">Quantity:</label>
                            </div>
                            <div class="col-auto">
                                <input type="number" id="quantity" name="quantity" class="form-control text-center fw-bold" value="1" min="1" th:max="${product.stock}" style="width: 90px;" th:disabled="${product.stock <= 0}">
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-success btn-lg rounded-pill px-4 shadow-sm" th:disabled="${product.stock <= 0}">
                                    <i class="bi bi-cart-plus-fill me-2"></i> Add to Cart
                                </button>
                            </div>
                        </div>
                    </form>

                    <div class="mt-4 pt-3 border-top">
                        <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm rounded-pill">
                            <i class="bi bi-arrow-left me-1"></i> Back to Products
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
